name: CI - Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backend/**"

jobs:
  # ===========================================
  # JOB 1: Run Tests
  # ===========================================
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # Step 3: Run tests
      - name: Run tests
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean test

      # Step 4: Upload test results (if tests fail)
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/target/surefire-reports/

  # ===========================================
  # JOB 2: Build Application
  # ===========================================
  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test # Only run if tests pass!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build project
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7
